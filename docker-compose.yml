name: nusa

# One connection string, defined once and shared by the services that need it.
# Inside the compose network the database is reachable as "postgres".
x-database-url: &database-url
  NUSA_DATABASE_URL: postgres://${POSTGRES_USER:-nusa}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — copy .env.example}@postgres:5432/${POSTGRES_DB:-nusa}?sslmode=disable

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nusa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — copy .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-nusa}
    ports:
      # Exposed so local tooling can reach it. Bound to localhost only.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nusa} -d ${POSTGRES_DB:-nusa}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Same image as the app, running its migrate command. Runs to completion
  # before the app starts, which is why `docker compose up` needs no manual
  # step on a fresh volume.
  migrate:
    build:
      context: .
    image: nusa:local
    restart: 'no'
    command: ['migrate', 'up']
    environment:
      <<: *database-url
      NUSA_ENV: ${NUSA_ENV:-development}
      NUSA_LOG_LEVEL: ${NUSA_LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
    image: nusa:local
    restart: unless-stopped
    ports:
      - '${NUSA_HTTP_PORT:-8080}:8080'
    environment:
      <<: *database-url
      NUSA_ENV: ${NUSA_ENV:-development}
      NUSA_HTTP_ADDR: ':8080'
      NUSA_LOG_LEVEL: ${NUSA_LOG_LEVEL:-info}
      NUSA_WEB_DIR: /app/web/dist
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
