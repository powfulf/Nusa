version: '2'

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert

  settings:
    depguard:
      rules:
        # Enforces the one architectural rule that everything else rests on:
        # the domain core is pure. Catching a stray import here is far cheaper
        # than discovering during M6 that the ledger cannot be tested without a
        # database.
        ledger-is-pure-domain:
          files:
            - '**/internal/ledger/**'
          deny:
            - pkg: database/sql
              desc: internal/ledger is pure domain — persistence belongs in internal/store
            - pkg: net/http
              desc: internal/ledger is pure domain — HTTP belongs in internal/api
            - pkg: github.com/powfulf/Nusa/internal/config
              desc: internal/ledger must not depend on configuration
            # NOT FALSIFIABLE TODAY, and kept anyway.
            #
            # internal/store imports internal/ledger, so an import the other
            # way is a compile-time cycle: Go refuses it before depguard is
            # consulted, and a deliberate break produces a typechecking error
            # rather than this message.
            #
            # This belongs to the §11 category of lines that are correct and
            # undefended, but for a DIFFERENT reason from the others in it.
            # The ORDER BY tie-break and the ClientIP branch are satisfied
            # incidentally by something that happens to do the same job. This
            # one is not satisfied at all — an earlier layer refuses the case
            # before the rule is reached, so the rule is never wrong, merely
            # never consulted. It becomes the only thing stopping the import
            # the day store no longer imports ledger.
            #
            # What proves this rule still matches after a module rename is the
            # internal/config denial beside it: no cycle, and its pattern
            # contains the module path.
            - pkg: github.com/powfulf/Nusa/internal/store
              desc: dependencies point inward — store may import ledger, never the reverse

        # The same list again, for the same reason, over a different package.
        #
        # internal/auth holds password hashing and TOTP: cryptography with an
        # external oracle (RFC 6238's test vectors, a measured Argon2id cost)
        # and no reason whatsoever to reach a database. Sessions and
        # credentials are rows, so they live behind repository interfaces that
        # internal/store implements — the same arrangement ledger has.
        #
        # The point is not tidiness. A crypto test that needs Docker is a
        # crypto test that gets skipped, and the RFC vectors are worth nothing
        # if they only run when someone remembers to start a container.
        auth-is-pure-cryptography:
          files:
            - '**/internal/auth/**'
          deny:
            - pkg: database/sql
              desc: internal/auth is pure — persistence belongs behind a repository interface in internal/store
            - pkg: net/http
              desc: internal/auth is pure — cookies, headers and handlers belong in internal/api
            - pkg: github.com/powfulf/Nusa/internal/config
              desc: internal/auth must not depend on configuration — parameters are passed in
            # Not falsifiable today either, and for the same reason: store
            # imports auth, so the reverse is a cycle and an earlier layer
            # refuses it before this rule is consulted. Never wrong, never
            # reached. See the note on the matching denial in
            # ledger-is-pure-domain for why that is a different case from a
            # line satisfied incidentally.
            #
            # Note that the net/http denial above proves this RULE still
            # matches, but not the RENAME: it names a standard-library package
            # and would fire however the module was spelled. Only a denial
            # whose pattern contains the module path tests that, and this rule
            # has one — internal/config.
            - pkg: github.com/powfulf/Nusa/internal/store
              desc: dependencies point inward — store may import auth, never the reverse

    revive:
      rules:
        - name: exported
          disabled: false

  exclusions:
    generated: lax
    rules:
      # Test fixtures routinely contain things gosec dislikes, such as
      # hardcoded example credentials.
      #
      # noctx is excluded for a narrower reason: it exists to catch outbound
      # requests made with no deadline, and httptest.NewRequest constructs a
      # request rather than making one. Nothing is dialled, so there is nothing
      # for a context to cancel.
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/powfulf/Nusa
