name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI runs at the declared floor, so "Go 1.22+" is a tested promise rather
  # than an aspiration. The tools module needs a newer toolchain, which
  # GOTOOLCHAIN=auto fetches on demand — that split is the whole point of
  # keeping tools in their own module.
  GO_VERSION: '1.22'
  GOTOOLCHAIN: auto
  NODE_VERSION: '22'

jobs:
  go-lint:
    name: Go · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # golangci-lint is pinned in tools/go.mod, so CI and developers always
      # run the same version.
      - name: Build tools
        run: go -C tools build -o "$PWD/bin/golangci-lint" github.com/golangci/golangci-lint/v2/cmd/golangci-lint

      - name: golangci-lint
        run: ./bin/golangci-lint run

      - name: Check formatting
        run: |
          ./bin/golangci-lint fmt
          git diff --exit-code || {
            echo "::error::Sources are not formatted. Run 'make fmt'."
            exit 1
          }

  go-test:
    name: Go · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  go-build:
    name: Go · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build -trimpath -o bin/nusa ./cmd/nusa

      # Generated query code must match the migrations and queries in the
      # repository. A drift here means someone edited generated files by hand
      # or forgot to run `make generate`.
      - name: Verify sqlc output is current
        run: |
          go -C tools build -o "$PWD/bin/sqlc" github.com/sqlc-dev/sqlc/cmd/sqlc
          ./bin/sqlc generate
          git diff --exit-code -- internal/store || {
            echo "::error::Generated code is stale. Run 'make generate' and commit the result."
            exit 1
          }

  web:
    name: Web · lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker · build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
