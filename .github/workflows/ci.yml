name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI runs at the declared floor, so "Go 1.22+" is a tested promise rather
  # than an aspiration.
  #
  # GOTOOLCHAIN is local everywhere by default, and auto only on the steps that
  # build the tools module. That asymmetry is load-bearing: with auto set
  # globally, a go.mod whose floor had crept up would simply cause Go to fetch
  # the newer toolchain and every job would pass, which is precisely the
  # failure the floor exists to catch. `go mod tidy` raises the floor on its
  # own if a transitive test dependency asks for it, so this is a live hazard
  # rather than a theoretical one.
  GO_VERSION: '1.22'
  GOTOOLCHAIN: local
  NODE_VERSION: '22'

jobs:
  go-lint:
    name: Go · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # golangci-lint is pinned in tools/go.mod, so CI and developers always
      # run the same version. Only this step may fetch a newer toolchain, and
      # only because tools/go.mod is a separate module that ships nothing.
      - name: Build tools
        env:
          GOTOOLCHAIN: auto
        run: go -C tools build -o "$PWD/bin/golangci-lint" github.com/golangci/golangci-lint/v2/cmd/golangci-lint

      - name: golangci-lint
        run: ./bin/golangci-lint run

      - name: Check formatting
        run: |
          ./bin/golangci-lint fmt
          git diff --exit-code || {
            echo "::error::Sources are not formatted. Run 'make fmt'."
            exit 1
          }

  go-test:
    name: Go · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  go-build:
    name: Go · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # A dependency upgrade must never decide what the application needs to
      # build. Comparing the directive against the version CI installs turns a
      # crept-up floor into a named failure rather than a puzzling one.
      - name: Verify the Go floor is unchanged
        run: |
          declared=$(go mod edit -json | sed -n 's/.*"Go": "\([^"]*\)".*/\1/p')
          if [ "$declared" != "${{ env.GO_VERSION }}" ]; then
            echo "::error::go.mod declares go $declared but the supported floor is ${{ env.GO_VERSION }}."
            echo "Raising the floor is a deliberate decision (CLAUDE.md §3), not a side effect of 'go mod tidy'."
            exit 1
          fi

      - name: Build
        run: go build -trimpath -o bin/nusa ./cmd/nusa

      # Generated query code must match the migrations and queries in the
      # repository. A drift here means someone edited generated files by hand
      # or forgot to run `make generate`.
      - name: Verify sqlc output is current
        env:
          GOTOOLCHAIN: auto
        run: |
          go -C tools build -o "$PWD/bin/sqlc" github.com/sqlc-dev/sqlc/cmd/sqlc
          ./bin/sqlc generate
          git diff --exit-code -- internal/store || {
            echo "::error::Generated code is stale. Run 'make generate' and commit the result."
            exit 1
          }

  web:
    name: Web · lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # DESIGN.md is the only place a visual decision is made. These two keep
      # it that way: the first rejects a raw colour, font or length that got
      # written straight into a component, the second recomputes every
      # text/surface pairing against the thresholds in DESIGN.md's
      # accessibility floor. Tailwind emits nothing for an unknown colour class
      # rather than failing, so the config alone would not catch a stray value.
      - name: Design tokens
        run: npm run lint:tokens

      - name: Contrast
        run: npm run test:contrast

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker · build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
