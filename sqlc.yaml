version: "2"
sql:
  - engine: "postgresql"
    # sqlc reads the same migration files golang-migrate applies, so generated
    # code can never drift from the real schema. Down migrations are ignored.
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
